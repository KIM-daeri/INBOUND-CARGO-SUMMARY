<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>INBOUND CARGO SUMMARY</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
         background: #f0f2f5; color: #2c3e50; }
  .header { background: #1a2a4a; color: white; padding: 16px 24px;
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 8px; }
  .header h1 { font-size: 1.3rem; }
  .header .sub { font-size: 0.8rem; opacity: 0.7; margin-top: 2px; }
  .header .upd { font-size: 0.75rem; opacity: 0.6; text-align: right; line-height: 1.6; }
  .container { max-width: 1180px; margin: 0 auto; padding: 16px; }
  /* 내용 카드 안 글자는 절대 줄바꿈하지 않음 (사용자 지정 2026-10-02). 화면이 좁으면 카드 안에서 옆으로 스크롤 */
  .card:not(.gate), .card:not(.gate) * { white-space: nowrap; }
  .card:not(.gate) { overflow-x: auto; }
  .card { background: white; border-radius: 12px; padding: 20px;
          box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 16px; }
  .section-title { font-size: 0.9rem; font-weight: 600; color: #7f8c8d;
                   text-transform: uppercase; letter-spacing: .05em;
                   margin-bottom: 14px; }
  .picker { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
  .pick { flex: 0 0 auto; background: white; border: 2px solid #e4e8ed; border-radius: 10px;
          padding: 10px 16px; cursor: pointer; text-align: left; font: inherit;
          color: inherit; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .pick:hover { border-color: #b9c4d0; }
  .pick[aria-current="true"] { border-color: #1a2a4a; background: #1a2a4a; color: white; }
  .pick .nm { font-size: 0.95rem; font-weight: 700; display: block; }
  .pick .vy { font-size: 0.8rem; opacity: .75; }
  .pick .ttl { font-size: 0.72rem; opacity: .65; display: block; margin-top: 3px; }
  .pick, .pick * { white-space: nowrap; }                  /* 카드 글자는 줄바꿈하지 않음 */
  .pick .sch { display: block; font-size: 0.78rem; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .pick .sl { display: inline-block; min-width: 4.6em; opacity: .65; }
  .vessel-hd { display: flex; align-items: baseline; gap: 10px;
               margin-bottom: 4px; }
  .vessel-hd h2 { font-size: 1.35rem; color: #1a2a4a; }
  .vessel-hd .voy { font-size: 1.05rem; font-weight: 600; color: #7f8c8d; }
  .tag { margin-left: auto; background: #1a2a4a; color: white; border-radius: 6px;
         padding: 4px 10px; font-size: 0.75rem; font-weight: 600; letter-spacing: .06em; }
  .meta { font-size: 0.78rem; color: #7f8c8d; line-height: 1.8; }
  .sum { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  .sum th { width: 132px; background: #1a2a4a; color: white; border-radius: 8px 0 0 8px;
            font-size: 0.8rem; letter-spacing: .04em; padding: 16px 12px; text-align: center; }
  .sum th.sp { background: #c0392b; }
  .sum th.wt { background: #7f8c8d; }
  .sum td { background: #f8f9fa; border-radius: 0 8px 8px 0; padding: 16px 18px;
            text-align: left; font-size: 0.92rem; border-bottom: 0; }
  .sum .big { font-size: 1.7rem; font-weight: 700; color: #1a2a4a;
              vertical-align: -2px; margin-right: 3px; }
  .sum b { font-weight: 700; }
  .sum .sep { color: #cfd6dd; margin: 0 10px; }
  .dg { color: #c0392b; } .rf { color: #16a085; } .oog { color: #8e44ad; }
  .zero { color: #b7c0c8; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th { background: #f8f9fa; padding: 9px 12px; text-align: center; font-weight: 600;
       color: #7f8c8d; font-size: 0.78rem; letter-spacing: .04em; }
  td { padding: 9px 12px; text-align: center; border-bottom: 1px solid #f0f0f0; }
  td.k { font-weight: 600; }
  .band { border-radius: 10px; padding: 11px 18px; margin: 22px 0 14px;
          font-size: 0.95rem; font-weight: 700; letter-spacing: .08em;
          color: white; background: #1a2a4a; }
  .band.other { background: #7f8c8d; }
  .band.transit { background: #8a3e1b; }
  .route { font-size: 0.85rem; color: #2c3e50; margin-top: 8px; }
  .route b { color: #c0392b; }
  .band .cnt { float: right; font-weight: 600; opacity: .85; letter-spacing: .02em; }
  .th-e { background: #eef1f5; }
  .th-dg { background: #fdeceb; color: #c0392b; }
  .th-rf { background: #e6f5f2; color: #16a085; }
  .th-oog { background: #f1ecfa; color: #8e44ad; }
  tr.tot td { background: #eef3f8; font-weight: 700; border-top: 2px solid #dfe6ee; }
  td.e { background: #fafbfc; }
  tr.alt td { background: #fafbfc; }
  td.l { text-align: left; }
  .kind { display: inline-block; font-size: 0.75rem; font-weight: 700;
          padding: 2px 8px; border-radius: 4px; }
  .k-dg { background: #fdeceb; color: #c0392b; }
  .k-rf { background: #e6f5f2; color: #16a085; }
  .k-oog { background: #f1ecfa; color: #8e44ad; }
  .scroll { overflow-x: auto; }
  .none { background: #f8f9fa; border-radius: 8px; padding: 22px 18px;
          text-align: center; color: #7f8c8d; font-size: 0.9rem; }
  td.mut { color: #95a5a6; }
  .foot { text-align: center; font-size: 0.75rem; color: #95a5a6; padding: 8px 0 24px; }
  .empty { text-align: center; color: #95a5a6; padding: 40px 20px; }
  /* 선박 카드 집계 상태 (신호등) */
  .lts { display: flex; gap: 10px; margin-top: 6px; font-size: 0.74rem; font-weight: 600; }
  .lt { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .plan-lts { gap: 18px; margin-top: 8px; font-size: 0.85rem; }   /* 확인한 플랜 신호등 (FINAL PLAN · CLL) */
  .sum th .big { color: white; }
  .sum td.lines div { line-height: 1.9; }
  .sum td.lines b.ng, .lt b.ng { color: #e03131; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.go { background: #27ae60; box-shadow: 0 0 0 2px rgba(39,174,96,.22); }
  .dot.wait { background: #f1c40f; box-shadow: 0 0 0 2px rgba(241,196,15,.28); }
  /* 통과 집계가 새로 끝난 카드: 초록 테두리가 숨 쉬듯 깜빡임 (누르면 그 사람 화면에서만 멈춤) */
  .pick.blink { border-color: #27ae60; animation: newdone 1.1s ease-in-out infinite; }
  .pick.blink .lt:last-child { animation: newtext 1.1s ease-in-out infinite; }
  @keyframes newdone { 0%, 100% { box-shadow: 0 0 0 0 rgba(39,174,96,0); }
                       50% { box-shadow: 0 0 0 6px rgba(39,174,96,.45); } }
  @keyframes newtext { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  /* INBOUND 메일과 같은 구성 (2026-10-01) */
  .leads { margin-top: 12px; padding-top: 12px; border-top: 1px solid #f0f0f0; }
  .lead { font-size: 0.92rem; line-height: 1.7; color: #2c3e50; }
  .lead.status-red { color: #c0392b; font-weight: 700; }
  b.ng { color: #e03131; }                       /* 통과 위험물 집계 전: 눈에 띄는 빨간색 */
  tr.sub td { background: #dce6ef; font-weight: 700; }     /* 해외·국내 선적분 S. TOTAL */
  tr.grand td { background: #1a2a4a; color: white; }      /* 통과 위험물 G. TOTAL */
  .sum td.spv { background: #fdf3ee; }
  .sum b.here { color: #c0392b; }
  .status { background: #f8f9fa; border-radius: 8px; padding: 12px 16px; font-size: 0.85rem;
            line-height: 1.8; margin-bottom: 12px; }
  .note { font-size: 0.75rem; color: #8a6d3b; margin-top: 8px; }
  table.narrow { width: auto; min-width: 420px; }
  td.plain { background: white !important; }
  td.g { background: #fafbfc; }
  /* 비밀번호 입력 */
  .gate { max-width: 380px; margin: 60px auto; }
  .gate h2 { font-size: 1.05rem; color: #1a2a4a; margin-bottom: 6px; }
  .gate p { font-size: 0.8rem; color: #7f8c8d; margin-bottom: 16px; line-height: 1.6; }
  .gate input[type=password] { width: 100%; font: inherit; font-size: 0.95rem; padding: 11px 12px;
          border: 2px solid #e4e8ed; border-radius: 8px; outline: none; }
  .gate input[type=password]:focus { border-color: #1a2a4a; }
  .gate label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem;
          color: #7f8c8d; margin: 12px 0 16px; cursor: pointer; }
  .gate button { width: 100%; font: inherit; font-weight: 700; font-size: 0.92rem; padding: 11px;
          border: 0; border-radius: 8px; background: #1a2a4a; color: white; cursor: pointer; }
  .gate button:disabled { opacity: .6; cursor: default; }
  .gate .err { color: #c0392b; font-size: 0.8rem; margin-top: 10px; min-height: 1.2em; }
  .lock { background: none; border: 1px solid rgba(255,255,255,.35); color: white; border-radius: 6px;
          font: inherit; font-size: 0.72rem; padding: 3px 8px; cursor: pointer; margin-top: 4px; }
  @media (max-width: 680px) {
    .header { flex-direction: column; align-items: flex-start; }
    .header .upd { text-align: left; }
  }
</style>
</head>

<div class="header">
  <div>
    <h1>&#128674; INBOUND CARGO SUMMARY</h1>
    <div class="sub">울산 입항 선박 &middot; INBOUND 화물 및 통과 위험물</div>
  </div>
  <div class="upd">&#128225; 2026-10-23 20:00 생성<br>항차 5건 &middot; 울산 출항 확인 시 삭제<br>
    <button class="lock" id="lock" type="button" hidden>잠그기</button></div>
</div>

<div class="container">

    <h2>&#128274; 비밀번호를 입력하세요</h2>

    <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호" required>

    <button type="submit" id="go">열기</button>
    <div class="err" id="err"></div>
  </form>
  <div id="app" hidden>
    <div class="picker" id="picker"></div>
    <div id="pane"></div>
    <div class="foot">* 본 대시보드는 해외 마지막 항구의 FINAL PLAN 수신 시 자동 게시됩니다. &nbsp;·&nbsp; * 문의: 김태중 대리</div>
  </div>
</div>

function esc(v){ return String(v == null ? "" : v).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function n(v){ return (typeof v === "number" ? v : 0).toLocaleString("en-US"); }
function b64(s){ var b = atob(s), a = new Uint8Array(b.length);
  for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
function store(fn){ try { return fn(); } catch (e) { return null; } }

function unlock(pw){
  var enc = new TextEncoder();
  return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
    .then(function(base){
      return crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(PAYLOAD.salt),
        iterations: PAYLOAD.iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    })
    .then(function(key){ return crypto.subtle.decrypt({name: "AES-GCM", iv: b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct)); })
    .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
}

function showApp(plans){
  PLANS = (plans || []).slice();
  // 선박 카드는 ETA 역순 — 가장 늦은(최근) 선박이 왼쪽 (사용자 지정 2026-10-06). 스케줄 ETA(sched.at), 없으면 분석 때 ETA
  var etaKey = function(p){ return (p.sched && p.sched.at) || (p.eta || "").replace(" ", "T") || ""; };
  PLANS.sort(function(a, b){ return etaKey(a) < etaKey(b) ? 1 : etaKey(a) > etaKey(b) ? -1 : 0; });
  sel = PLANS.length ? PLANS[0].id : null;
  document.getElementById("gate").hidden = true;
  document.getElementById("app").hidden = false;
  document.getElementById("lock").hidden = false;
  render();
  setInterval(render, 60000);          // 남은 시간을 1분마다 다시 셈합니다
}

function tryOpen(pw, remember){
  var go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; err.textContent = "";
  return unlock(pw).then(function(plans){
    if (remember) store(function(){ localStorage.setItem(KEY, pw); });
    showApp(plans);
  }).catch(function(){
    store(function(){ localStorage.removeItem(KEY); });
    err.textContent = "비밀번호가 맞지 않습니다.";
    go.disabled = false;
  });
}

document.getElementById("gate").addEventListener("submit", function(e){
  e.preventDefault();
  tryOpen(document.getElementById("pw").value, document.getElementById("remember").checked);
});
document.getElementById("lock").addEventListener("click", function(){
  store(function(){ localStorage.removeItem(KEY); });
  location.reload();
});

}

// 선박 카드 집계 상태 (신호등, 사용자 지정 2026-10-01)
//   수입 집계 완료(초록) · 통과 집계 전(노랑: 국내 기항지 PRE 대기) · 통과 집계 완료(초록)
function lights(p){
  var m = p.mail || {}, t = m.transit || {};
  var out = '<span class="lt"><i class="dot go"></i>수입 집계 완료</span>';
  if (t.known){
    out += (t.pending || []).length
      ? '<span class="lt"><i class="dot wait"></i>통과 집계 전</span>'
      : '<span class="lt"><i class="dot go"></i>통과 집계 완료</span>';

// 통과 위험물 집계가 나중에 끝난 항차는 카드가 깜빡임 (사용자 지정 2026-10-01)
//   보는 사람마다 따로: 카드를 누르면 그 브라우저에만 '확인함'을 남겨 그 사람 화면에서만 멈춤 (다른 사람은 계속 깜빡임)
var ACK = "inbound-transit-seen:";
function isNew(p){
  // 집계가 모두 끝난 카드: 국내 기항지가 있으면 모두 집계(done), 없으면(해외에서 바로 울산) 그대로 완료 (2026-10-08)
  var s = stateOf((p.mail || {}).transit);
  if (!p.transitDoneAt || (s !== "done" && s !== "")) return false;
  return store(function(){ return localStorage.getItem(ACK + p.id); }) !== p.transitDoneAt;
}
function ack(p){
  if (p.transitDoneAt) store(function(){ localStorage.setItem(ACK + p.id, p.transitDoneAt); });
}

function renderPicker(){
  var box = document.getElementById("picker");
  box.innerHTML = "";
  PLANS.forEach(function(p){
    var b = document.createElement("button");
    b.className = "pick" + (isNew(p) ? " blink" : "");
    b.type = "button";
    b.setAttribute("aria-current", String(p.id === sel));
    // 선박 스케줄 ETA·ETB (스케줄 AGENT 표와 같은 값, BAYPLAN 실행마다 갱신 — 사용자 지정 2026-10-02)
    var s = p.sched || {};
    var sched = (s.eta || s.etb)
      ? '<span class="sch"><span class="sl">ETA(입항)</span> ' + esc(s.eta || "-") + '</span>' +
        '<span class="sch"><span class="sl">ETB(접안)</span> ' + esc(s.etb || "-") + '</span>'
      : '';
    b.innerHTML = '<span class="nm">' + esc(p.vessel || p.code) +
      ' <span class="vy">' + esc(p.voyage) + '</span></span>' + sched + lights(p) +
      '<span class="ttl">' + esc(leftText(p)) + '</span>';
    b.addEventListener("click", function(){ ack(p); sel = p.id; render(); });
    box.appendChild(b);
  });
}

function dischargeInfo(m){

      return '<td' + (cls[k] ? ' class="' + cls[k] + '"' : '') + '>' + (k === "tot" ? '<b>' + txt + '</b>' : txt) + '</td>';
    }).join("");

  var rows = m.discharge.map(function(r){

        '<td class="k">' + esc(r.opr) + '</td>' + nums(r, true) + '</tr>';

        (r.type === "waiting" ? '<b class="ng">집계 전</b>' : '<span class="zero">울산 양하 화물 없음</span>') + '</td></tr>';

      (r.wait ? '<td colspan="' + keys.length + '">국내 선적분 집계 후 제공</td>' : nums(r, false)) + '</tr>';
  }).join("");
  return sec("DISCHARGING CARGO INFORMATION", '<div class="scroll"><table><thead>' + head + '</thead><tbody>' + rows +
    '</tbody></table></div>' + (m.prefixNote ? '<div class="note">※ 파일에 선사(OPR) 항목이 없어 컨테이너 번호 앞 4자리 기준으로 집계했습니다.</div>' : ''));
}

// 통과 위험물 집계 문구 (대시보드 전용, 사용자 지정 2026-10-01)
//   집계 완료: 숫자 + 굵은 '(집계 완료)' / 집계 전: 빨간 굵은 글씨 / 통과 위험물이 없어도 숫자 0 / 괄호는 앞 글자에 붙여 씀
var DONE = '<b>(집계 완료)</b>';
function foreignTxt(t){ return '<b>' + n((t || {}).foreign) + '</b>' + DONE; }
// 국내 선적분 집계 상태 (메일 report.domestic_state와 같음): "" 국내 기항지 없음 / done / partial / pending
function stateOf(t){
  t = t || {};
  var ports = t.domesticPorts || [], pend = (t.pending || []).filter(function(p){ return ports.indexOf(p) >= 0; });
  if (!ports.length) return "";
  return !pend.length ? "done" : (pend.length < ports.length ? "partial" : "pending");
}
function stateTxt(cnt, state, long){
  if (state === "done") return '<b>' + n(cnt) + '</b>' + DONE;
  if (state === "partial")                                    // 일부 기항지만 PRE 수신: 집계된 수 + 빨간 안내
    return '<b>' + n(cnt) + '</b><b class="ng">' + (long ? "(일부 기항지 PRE PLAN 미수신)" : "(일부 집계 전)") + '</b>';
  return '<b class="ng">집계 전' + (long ? "(전 기항지 PRE PLAN 미수신)" : "") + '</b>';
}
function domesticTxt(t, long){
  var s = stateOf(t);
  return s ? stateTxt((t || {}).domestic, s, long) : "";     // 해외에서 바로 울산이면 국내 선적분 없음
}

function transitSections(m){
  var t = m.transit || {};
  if (!t.known) return "";
  // 울산 항로가 국내항에서 시작하면(noForeign) 해외 선적분 줄 없음 (2026-10-07)
  var lines = (t.noForeign ? [] : ['해외 선적분: ' + foreignTxt(t)])
    .concat(domesticTxt(t, true) ? ['국내 선적분: ' + domesticTxt(t, true)] : []);
  var info = '<div class="status">' + lines.join('<br>') + '</div>';
  if (!t.count && !(t.info || []).length){
    var s = stateOf(t);
    if (s === "" || s === "done")                            // 해외·국내 모두 없음으로 확정 → 없음 박스
      info += '<div class="none">' + esc(m.podKr) + ' 통과 위험물이 없습니다.</div>';
    return '<div class="band transit">통과 위험물 SUMMARY</div>' + sec("통과 위험물 INFORMATION", info);
  }
  // 해외 선적분 줄 → 해외 선적분 S. TOTAL → 국내 선적분 줄 → 집계 전 국내 기항지 → 국내 선적분 S. TOTAL(모두 집계 후)
  //   → 통과 위험물 G. TOTAL(국내 집계 전이면 '국내 선적분 집계 후 제공') — 메일과 같은 줄 (사용자 지정 2026-10-01)
  var rows = t.info.map(function(r){
    if (r.type === "sub") return '<tr class="sub"><td colspan="3">' + esc(r.label) + '</td><td>' + n(r.cnt) + '</td></tr>';
    if (r.type === "waiting")
      return '<tr class="' + (r.band ? "alt" : "") + '"><td class="k">' + esc(r.pol) + '</td><td colspan="3"><b class="ng">집계 전</b></td></tr>';
    if (r.type === "grand") return '<tr class="tot grand"><td colspan="3">' + esc(r.label) + '</td><td>' +
      (r.wait ? "국내 선적분 집계 후 제공" : n(r.cnt)) + '</td></tr>';
    // POL이 같으면 POL 칸, 그 안에서 POD가 같으면 POD 칸을 병합 (사용자 지정 2026-10-02)
    var lead = (r.polSpan ? '<td class="k" rowspan="' + r.polSpan + '">' + esc(r.pol) + '</td>' : '') +
               (r.span ? '<td class="k" rowspan="' + r.span + '">' + esc(r.pod) + '</td>' : '');
    return '<tr class="' + (r.band ? "alt" : "") + '">' + lead + '<td>' + esc(r.opr) + '</td><td class="dg">' + n(r.cnt) + '</td></tr>';
  }).join("");
  info += '<div class="scroll"><table class="narrow"><thead><tr><th>POL</th><th>POD</th><th>선사</th>' +
    '<th class="th-dg">DG</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  // 통과 위험물 DETAIL은 넣지 않음 (사용자 지정 2026-10-02: INFORMATION만)
  return '<div class="band transit">통과 위험물 SUMMARY</div>' + sec("통과 위험물 INFORMATION", info);
}

    : m.hasCargo
    ? '<p class="lead"><b>M/V ' + esc(m.vesselVoy) + '</b> 선사별 INBOUND 물량 송부 드립니다.</p>' +
      (m.planStatus ? '<p class="lead status-red">' + esc(m.planStatus) + '</p>' : '')
    : '<p class="lead"><b>M/V ' + esc(m.vesselVoy) + '</b>는 <b>' + esc(m.podKr) + ' 양하 화물이 없습니다.</b></p>' +
      (m.viaDomestic ? '<p class="lead">' + esc(m.domesticKr) + ' CLL(없으면 PRE PLAN) 수신 시 통과 위험물 정보를 보완하여 이 메일을 다시 송부 드리겠습니다.</p>' : '');
  pane.innerHTML =
    '<div class="card">' +
      '<div class="vessel-hd"><h2>M/V ' + esc(p.vessel || p.code) + '</h2>' +
      '<span class="voy">' + esc(p.voyage) + '</span>' +
      '<span class="tag">FROM ' + esc(p.fromPort) + '</span></div>' +
      '<div class="meta">' + esc(p.code) +
        (p.eta ? ' &nbsp;&middot;&nbsp; 울산 ETA ' + esc(p.eta) : '') +
        ' &nbsp;&middot;&nbsp; 작업 ' + esc(p.updated) + ' &nbsp;&middot;&nbsp; ' + esc(leftText(p)) + '</div>' +
      '<div class="leads">' + lead + '</div>' +
    '</div>' +
    // 울산 양하분이 없어도 같은 구성으로 그림 — INBOUND CARGO INFORMATION은 '수입 화물이 없습니다' 박스 (2026-10-01)
    totalSummary(m) + '<div class="band">' + (m.discharge ? 'DISCHARGING CARGO SUMMARY' : 'INBOUND CARGO SUMMARY') +
    '</div>' + cargoInfo(m) + specialDetail(m) + transitSections(m);
}

// 기억해 둔 비밀번호가 있으면 바로 엽니다
(function(){
  if (!PAYLOAD){ document.getElementById("err").textContent = "게시된 데이터가 없습니다."; return; }
  var saved = store(function(){ return localStorage.getItem(KEY); });
  if (saved){ document.getElementById("remember").checked = true; tryOpen(saved, true); }
})();
</script>

</body>
</html>
