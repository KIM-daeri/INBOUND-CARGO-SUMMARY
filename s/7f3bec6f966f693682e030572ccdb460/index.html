var TTL_MS = 168 * 3600 * 1000;
var KEY = "inbound-cargo-pw";
var PLANS = [], sel = null;

function esc(v){ return String(v == null ? "" : v).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function n(v){ return (typeof v === "number" ? v : 0).toLocaleString("en-US"); }
function b64(s){ var b = atob(s), a = new Uint8Array(b.length);
  for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
function store(fn){ try { return fn(); } catch (e) { return null; } }

// ── 복호화 (PBKDF2-SHA256 → AES-256-GCM) ─────────────────────
function unlock(pw){
  var enc = new TextEncoder();
  return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
    .then(function(base){
      return crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(PAYLOAD.salt),
        iterations: PAYLOAD.iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    })
    .then(function(key){ return crypto.subtle.decrypt({name: "AES-GCM", iv: b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct)); })
    .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
}

function showApp(plans){
  PLANS = plans || [];
  sel = PLANS.length ? PLANS[0].id : null;
  document.getElementById("gate").hidden = true;
  document.getElementById("app").hidden = false;
  document.getElementById("lock").hidden = false;
  render();
  setInterval(render, 60000);          // 남은 시간을 1분마다 다시 셈합니다
}

function tryOpen(pw, remember){
  var go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; err.textContent = "";
  return unlock(pw).then(function(plans){
    if (remember) store(function(){ localStorage.setItem(KEY, pw); });
    showApp(plans);
  }).catch(function(){
    store(function(){ localStorage.removeItem(KEY); });
    err.textContent = "비밀번호가 맞지 않습니다.";
    go.disabled = false;
  });
}

document.getElementById("gate").addEventListener("submit", function(e){
  e.preventDefault();
  tryOpen(document.getElementById("pw").value, document.getElementById("remember").checked);
});
document.getElementById("lock").addEventListener("click", function(){
  store(function(){ localStorage.removeItem(KEY); });
  location.reload();
});

// ── 화면 ────────────────────────────────────────────────────
function leftText(p){
  if (typeof p.savedAt !== "number") return "";
  var ms = p.savedAt + TTL_MS - Date.now();
  if (ms <= 0) return "보관 기간 지남";
  var m = Math.floor(ms / 60000), h = Math.floor(m / 60);
  return "삭제까지 남은 시간 " + h + "시간 " + String(m % 60).padStart(2, "0") + "분";
}

function renderPicker(){
  var box = document.getElementById("picker");
  box.innerHTML = "";
  PLANS.forEach(function(p){
    var b = document.createElement("button");
    b.className = "pick";
    b.type = "button";
    b.setAttribute("aria-current", String(p.id === sel));
    b.innerHTML = '<span class="nm">' + esc(p.vessel || p.code) +
      ' <span class="vy">' + esc(p.voyage) + '</span></span>' +
      '<span class="ttl">' + esc(leftText(p)) + '</span>';
    b.addEventListener("click", function(){ sel = p.id; render(); });
    box.appendChild(b);
  });
}

function figures(x){
  var size = '20&#39; <b>' + n(x.c20) + '</b><span class="sep">&middot;</span>40&#39; <b>' + n(x.c40) + '</b>';
  if (x.c45) size += '<span class="sep">&middot;</span>45&#39; <b>' + n(x.c45) + '</b>';
  function cnt(v, cls){ return '<b class="' + (v ? cls : "zero") + '">' + n(v) + '</b> 대'; }
  return '<table class="sum"><tbody>' +
    '<tr><th>TOTAL</th><td><span class="big">' + n(x.total) + '</span> 대' +
      '<span class="sep">|</span>FULL <b>' + n(x.full) + '</b>' +
      '<span class="sep">&middot;</span>EMPTY <b>' + n(x.empty) + '</b>' +
      '<span class="sep">|</span>' + size + '</td></tr>' +
    '<tr><th class="sp">SPECIAL</th><td>DG ' + cnt(x.dg, "dg") +
      '<span class="sep">|</span>RF ' + cnt(x.rf, "rf") +
      '<span class="sep">|</span>OOG ' + cnt(x.oog, "oog") + '</td></tr>' +
    '<tr><th class="wt">양하 적재 중량</th><td><span class="big">' +
      (x.cargoMt || 0).toLocaleString("en-US",
        {minimumFractionDigits: 1, maximumFractionDigits: 1}) + '</span> MT</td></tr>' +
  '</tbody></table>';
}

function has45(x){
  var t = x.totals || {};
  return (t.f45 || 0) + (t.e45 || 0) > 0;
}

function detailTable(x){
  var rows = x.operators || [];
  if (!rows.length) return "";
  var t = x.totals || {}, w45 = has45(x);
  var head = '<tr><th>선사</th>' +
    "<th>20&#39; FULL</th><th>40&#39; FULL</th>" + (w45 ? "<th>45&#39; FULL</th>" : "") +
    "<th class='th-e'>20&#39; EMPTY</th><th class='th-e'>40&#39; EMPTY</th>" +
    (w45 ? "<th class='th-e'>45&#39; EMPTY</th>" : "") +
    '<th>TOTAL</th><th class="th-dg">DG</th><th class="th-rf">RF</th>' +
    '<th class="th-oog">OOG</th></tr>';
  function line(r, first){
    return first +
      '<td>' + n(r.f20) + '</td><td>' + n(r.f40) + '</td>' +
      (w45 ? '<td>' + n(r.f45) + '</td>' : '') +
      '<td class="e">' + n(r.e20) + '</td><td class="e">' + n(r.e40) + '</td>' +
      (w45 ? '<td class="e">' + n(r.e45) + '</td>' : '') +
      '<td><b>' + n(r.tot) + '</b></td>' +
      '<td class="dg">' + n(r.dg) + '</td>' +
      '<td class="rf">' + n(r.rf) + '</td>' +
      '<td class="oog">' + n(r.oog) + '</td></tr>';
  }
  var body = rows.map(function(r){ return line(r, '<tr><td class="k">' + esc(r.opr) + '</td>'); }).join("");
  var total = line(t, '<tr class="tot"><td>TOTAL</td>');
  return '<div class="card"><div class="section-title">&#128203; INBOUND CARGO DETAIL</div>' +
    '<div class="scroll"><table><thead>' + head + '</thead><tbody>' + body + total +
    '</tbody></table></div></div>';
}

function specialTable(x){
  var rows = x.specials || [];
  var head = '<div class="card"><div class="section-title">&#9888; SPECIAL CARGO INFORMATION</div>';
  if (!rows.length){
    // 없으면 없다고 적어 둡니다 — 확인이 끝났다는 뜻이 되도록.
    return head + '<div class="none">' + esc(x.podKr || x.pod) +
      ' 양하 예정 SPECIAL CARGO가 없습니다.</div></div>';
  }
  var body = rows.map(function(r){
    var k = String(r.kind || "");
    var cls = k.indexOf("DG") >= 0 ? "k-dg" : (k.indexOf("RF") >= 0 ? "k-rf" : "k-oog");
    return '<tr class="' + (r.grp ? "alt" : "") + '">' +
      '<td class="mut">' + n(r.no) + '</td>' +
      '<td class="k">' + esc(r.opr) + '</td>' +
      '<td class="k">' + esc(r.ctnr) + '</td>' +
      '<td>' + esc(r.szty) + '</td>' +
      '<td>' + esc(r.fe) + '</td>' +
      '<td><span class="kind ' + cls + '">' + esc(k) + '</span></td>' +
      '<td class="l">' + esc(r.detail) + '</td></tr>';
  }).join("");
  return head + '<div class="scroll"><table><thead><tr><th>NO.</th><th>선사</th><th>CNTR NO.</th>' +
    '<th>SZ/TY</th><th>F/E</th><th>SPECIAL 구분</th><th>CARGO DETAIL</th></tr></thead>' +
    '<tbody>' + body + '</tbody></table></div></div>';
}

function portBlock(x, i){
  return '<div class="band' + (x.pod === "KRUSN" ? "" : " other") + '">FOR ' + esc(x.podEn || x.pod) +
      '<span class="cnt">' + esc(x.pod) + ' &middot; ' + n(x.total) + '대</span></div>' +
    '<div class="card"><div class="section-title">&#128202; INBOUND CARGO SUMMARY</div>' + figures(x) + '</div>' +
    detailTable(x) + specialTable(x);
}

function render(){
  renderPicker();
  var p = PLANS.filter(function(x){ return x.id === sel; })[0] || PLANS[0];
  var pane = document.getElementById("pane");
  if (!p){
    pane.innerHTML = '<div class="card empty">보관 기간이 남은 항차가 없습니다.<br>' +
      '해외 마지막 기항지의 FINAL BAYPLAN이 올라오면 AGENT가 여기에 게시합니다.</div>';
    return;
  }
  sel = p.id;
  var ports = p.ports || [];
  var ulsan = ports.filter(function(x){ return x.pod === "KRUSN"; })[0];
  pane.innerHTML =
    '<div class="card">' +
      '<div class="vessel-hd"><h2>M/V ' + esc(p.vessel || p.code) + '</h2>' +
      '<span class="voy">' + esc(p.voyage) + '</span>' +
      '<span class="tag">FROM ' + esc(p.fromPort) + '</span></div>' +
      '<div class="meta">' + esc(p.code) +
        (p.eta ? ' &nbsp;&middot;&nbsp; 울산 ETA ' + esc(p.eta) : '') +
        ' &nbsp;&middot;&nbsp; 본선 ' + n(p.shipTotal) + '대 중 울산 양하 ' + n(ulsan ? ulsan.total : 0) + '대' +
        ' &nbsp;&middot;&nbsp; 양하항 ' + ports.map(function(x){ return esc(x.pod); }).join(" · ") +
        ' &nbsp;&middot;&nbsp; 작업 ' + esc(p.updated) +
        ' &nbsp;&middot;&nbsp; ' + esc(leftText(p)) + '</div>' +
    '</div>' +
    (ulsan ? "" : '<div class="band">FOR ULSAN<span class="cnt">KRUSN &middot; 0대</span></div>' +
      '<div class="card"><div class="none">울산항 양하 예정 화물이 없습니다.</div></div>') +
    ports.map(portBlock).join("");
}

// 기억해 둔 비밀번호가 있으면 바로 엽니다
(function(){
  if (!PAYLOAD){ document.getElementById("err").textContent = "게시된 데이터가 없습니다."; return; }
  var saved = store(function(){ return localStorage.getItem(KEY); });
  if (saved){ document.getElementById("remember").checked = true; tryOpen(saved, true); }
})();
</script>
